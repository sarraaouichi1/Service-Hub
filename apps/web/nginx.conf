server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  # The API is served from the same origin as the app, so the session cookie
  # is a first-party cookie and CORS never enters into it.
  location /api/ {
    proxy_pass http://api:3001;
    proxy_http_version 1.1;
    # $http_host keeps the port; $host drops it, which would break the API's
    # same-origin check for any address reached on a non-default port.
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Client-side routing: unknown paths are the router's business, not a 404.
  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(js|css|woff2?|svg|png|jpg|ico)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
