<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700">
  <defs>
    <filter id="shadow3" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.1" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="700" fill="#F8FAFC" />

  <!-- Top Header Bar -->
  <rect x="0" y="0" width="1200" height="65" fill="#001E42" />
  <text x="35" y="38" font-family="Outfit, sans-serif" font-size="18" font-weight="900" fill="#FFFFFF">SCHEIDT &amp; BACHMANN ONBOARDING DESK</text>
  <text x="380" y="38" font-family="Plus Jakarta Sans, sans-serif" font-size="12" fill="#FFC200">Split-Pane Inspection Workspace</text>

  <!-- Left Master Queue List Pane (35% width) -->
  <g transform="translate(30, 85)">
    <rect x="0" y="0" width="370" height="585" rx="14" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#shadow3)" />
    
    <!-- Search Bar -->
    <rect x="15" y="15" width="340" height="38" rx="8" fill="#F1F5F9" stroke="#CBD5E1" />
    <text x="30" y="39" font-family="Plus Jakarta Sans, sans-serif" font-size="12" fill="#64748B">🔍 Search requests by email or ID...</text>

    <!-- Item 1 Selected -->
    <rect x="15" y="65" width="340" height="90" rx="10" fill="#EFF6FF" stroke="#0066CC" stroke-width="2" />
    <text x="30" y="92" font-family="Outfit, sans-serif" font-size="13" font-weight="800" fill="#001E42">#REQ-2026-01</text>
    <text x="30" y="110" font-family="Plus Jakarta Sans, sans-serif" font-size="12" fill="#1E293B">customer@scheidt-bachmann.de</text>
    <rect x="30" y="122" width="90" height="18" rx="9" fill="#FEF3E8" />
    <text x="40" y="135" font-family="Outfit, sans-serif" font-size="10" font-weight="800" fill="#D97706">Sales Review</text>

    <!-- Item 2 -->
    <rect x="15" y="165" width="340" height="90" rx="10" fill="#FFFFFF" stroke="#E2E8F0" />
    <text x="30" y="192" font-family="Outfit, sans-serif" font-size="13" font-weight="800" fill="#001E42">#REQ-2026-02</text>
    <text x="30" y="210" font-family="Plus Jakarta Sans, sans-serif" font-size="12" fill="#64748B">Marc Delvaux (Manager Test)</text>
    <rect x="30" y="222" width="90" height="18" rx="9" fill="#EFF6FF" />
    <text x="42" y="235" font-family="Outfit, sans-serif" font-size="10" font-weight="800" fill="#2563EB">Tech Review</text>

    <!-- Item 3 -->
    <rect x="15" y="265" width="340" height="90" rx="10" fill="#FFFFFF" stroke="#E2E8F0" />
    <text x="30" y="292" font-family="Outfit, sans-serif" font-size="13" font-weight="800" fill="#001E42">#REQ-2026-03</text>
    <text x="30" y="310" font-family="Plus Jakarta Sans, sans-serif" font-size="12" fill="#64748B">Anna Krüger (Sales Test)</text>
    <rect x="30" y="322" width="90" height="18" rx="9" fill="#ECFDF5" />
    <text x="44" y="335" font-family="Outfit, sans-serif" font-size="10" font-weight="800" fill="#059669">Provisioned</text>
  </g>

  <!-- Right Deep Inspection Workspace Pane (65% width) -->
  <g transform="translate(420, 85)">
    <rect x="0" y="0" width="750" height="585" rx="14" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#shadow3)" />

    <!-- Inspection Pane Header -->
    <text x="30" y="45" font-family="Outfit, sans-serif" font-size="20" font-weight="900" fill="#001E42">INSPECTING: Request #REQ-2026-01</text>
    <rect x="620" y="24" width="100" height="26" rx="13" fill="#FEF3E8" />
    <text x="635" y="41" font-family="Outfit, sans-serif" font-size="11" font-weight="800" fill="#D97706">Sales Review</text>

    <line x1="30" y1="65" x2="720" y2="65" stroke="#E2E8F0" stroke-width="1" />

    <!-- Stepper Pipeline -->
    <g transform="translate(30, 85)">
      <line x1="40" y1="20" x2="620" y2="20" stroke="#CBD5E1" stroke-width="3" />
      <line x1="40" y1="20" x2="240" y2="20" stroke="#0066CC" stroke-width="3" />

      <!-- Step 1 -->
      <circle cx="40" cy="20" r="14" fill="#0066CC" />
      <text x="36" y="25" font-family="Outfit, sans-serif" font-size="12" font-weight="900" fill="#FFFFFF">✓</text>
      <text x="15" y="48" font-family="Outfit, sans-serif" font-size="11" font-weight="800" fill="#0066CC">1. Submitted</text>

      <!-- Step 2 -->
      <circle cx="240" cy="20" r="14" fill="#FFC200" stroke="#001E42" stroke-width="2" />
      <text x="236" y="25" font-family="Outfit, sans-serif" font-size="12" font-weight="900" fill="#001E42">2</text>
      <text x="210" y="48" font-family="Outfit, sans-serif" font-size="11" font-weight="800" fill="#001E42">2. Sales Review</text>

      <!-- Step 3 -->
      <circle cx="430" cy="20" r="14" fill="#E2E8F0" />
      <text x="426" y="25" font-family="Outfit, sans-serif" font-size="12" font-weight="900" fill="#64748B">3</text>
      <text x="400" y="48" font-family="Outfit, sans-serif" font-size="11" font-weight="800" fill="#64748B">3. Tech Review</text>

      <!-- Step 4 -->
      <circle cx="620" cy="20" r="14" fill="#E2E8F0" />
      <text x="616" y="25" font-family="Outfit, sans-serif" font-size="12" font-weight="900" fill="#64748B">4</text>
      <text x="590" y="48" font-family="Outfit, sans-serif" font-size="11" font-weight="800" fill="#64748B">4. Provisioned</text>
    </g>

    <!-- Form Data Inspection Box -->
    <rect x="30" y="165" width="690" height="310" rx="12" fill="#F8FAFC" stroke="#E2E8F0" />
    <text x="50" y="195" font-family="Outfit, sans-serif" font-size="13" font-weight="900" fill="#001E42">CUSTOMER SUBMISSION DETAILS:</text>

    <text x="50" y="230" font-family="Plus Jakarta Sans, sans-serif" font-size="13" fill="#64748B">Customer Email:</text>
    <text x="200" y="230" font-family="Plus Jakarta Sans, sans-serif" font-size="13" fill="#1E293B" font-weight="700">customer@scheidt-bachmann.de</text>

    <text x="50" y="265" font-family="Plus Jakarta Sans, sans-serif" font-size="13" fill="#64748B">Company Name:</text>
    <text x="200" y="265" font-family="Plus Jakarta Sans, sans-serif" font-size="13" fill="#1E293B" font-weight="700">Scheidt &amp; Bachmann Maghreb</text>

    <text x="50" y="300" font-family="Plus Jakarta Sans, sans-serif" font-size="13" fill="#64748B">Product Line:</text>
    <text x="200" y="300" font-family="Plus Jakarta Sans, sans-serif" font-size="13" fill="#0066CC" font-weight="700">Parking Management System (entervo)</text>

    <text x="50" y="335" font-family="Plus Jakarta Sans, sans-serif" font-size="13" fill="#64748B">Assigned Reviewer:</text>
    <text x="200" y="335" font-family="Plus Jakarta Sans, sans-serif" font-size="13" fill="#1E293B" font-weight="700">Sales Test (Sales Department)</text>

    <!-- Action Bar -->
    <g transform="translate(30, 500)">
      <rect x="0" y="0" width="180" height="44" rx="8" fill="#10B981" />
      <text x="32" y="27" font-family="Outfit, sans-serif" font-size="13" font-weight="900" fill="#FFFFFF">✅ APPROVE REQUEST</text>

      <rect x="200" y="0" width="140" height="44" rx="8" fill="#DC2626" />
      <text x="240" y="27" font-family="Outfit, sans-serif" font-size="13" font-weight="900" fill="#FFFFFF">❌ REJECT</text>

      <rect x="355" y="0" width="150" height="44" rx="8" fill="#001E42" />
      <text x="390" y="27" font-family="Outfit, sans-serif" font-size="13" font-weight="900" fill="#FFC200">➡️ REASSIGN</text>
    </g>
  </g>
</svg>
