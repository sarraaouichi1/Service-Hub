# Demo deployment at https://sb.demo.walidessaied.com, on the shared VPS behind
# Coolify's Traefik. Nothing publishes a host port: Traefik owns 80/443/8080
# there, and only the web container joins its `coolify` network. The API and
# database stay on the private network, so the `api` name nginx proxies to
# can't collide with another app's container on the shared one.
#
#   docker compose -p service-hub-sb-demo --env-file .env -f docker-compose.demo.yml up -d --build
#   docker compose -p service-hub-sb-demo --env-file .env -f docker-compose.demo.yml exec api pnpm --filter @service-hub/api db:seed

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - app

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET}
      WEB_ORIGIN: ${WEB_ORIGIN:?set WEB_ORIGIN}
      AUTH_PROVIDER: ${AUTH_PROVIDER:-local}
      SEED_PASSWORD: ${SEED_PASSWORD:?set SEED_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    labels:
      traefik.enable: "true"
      traefik.docker.network: coolify
      traefik.http.middlewares.sb-demo-gzip.compress: "true"
      traefik.http.middlewares.sb-demo-redirect-to-https.redirectscheme.scheme: https
      traefik.http.routers.sb-demo-http.entrypoints: http
      traefik.http.routers.sb-demo-http.rule: Host(`sb.demo.walidessaied.com`)
      traefik.http.routers.sb-demo-http.middlewares: sb-demo-redirect-to-https
      traefik.http.routers.sb-demo-https.entrypoints: https
      traefik.http.routers.sb-demo-https.rule: Host(`sb.demo.walidessaied.com`)
      traefik.http.routers.sb-demo-https.middlewares: sb-demo-gzip
      traefik.http.routers.sb-demo-https.tls: "true"
      traefik.http.routers.sb-demo-https.tls.certresolver: letsencrypt
      traefik.http.services.sb-demo-web.loadbalancer.server.port: "8080"
    networks:
      - app
      - coolify

volumes:
  db-data:

networks:
  app:
    driver: bridge
  coolify:
    external: true
